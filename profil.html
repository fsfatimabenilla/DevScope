<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
     <script src="https://cdn.tailwindcss.com"></script>
     <script src="js/modeles/profile.js" type="module"></script>
</head>

    <body class="min-h-screen bg-pink-100 text-gray-800">

    <header class=" w-full bg-rose-200">
        <div class="flex items-center justify-between px-6 py-4">
            <h1 class="text-2xl font-bold text-rose-800 tracking-wide">DevScope </h1>
            <nav>
                <ul class="flex items-center gap-5">
                    <li><a href="index.html" class="rounded-lg bg-pink-100 px-4 py-2 text-rose-800"> Recherche</a></li>
                    <li><a href="shortlist.html"class="text-rose-800">Shortlist</a></li>
                </ul>
            </nav>
        </div>
    </header>
        <div class="flex flex-col lg:flex-row min-h-[calc(100vh-74px)]">
                 <aside class="w-full lg:w-80 lg:shrink-0 m-3">

            <div id="profile-card"
                 class="bg-white border border-rose-200 rounded-2xl p-6">

                <div class="flex flex-col items-center text-center">

                    <img id="avatar"src=""
                     alt="Photo du développeur" class="w-32 h-32 rounded-full object-cover border-4 border-rose-200">
                    <h2 id="nom" class="mt-4 text-2xl font-bold text-rose-900">
                        Username
                    </h2>
                    <p id="login" class="mt-1 text-rose-500"> @login</p>

                </div>

                <div class="mt-7">
                    <h3 class="font-bold text-rose-800 text-lg">
                        À propos
                    </h3>
                    <p id="bio" class="mt-2 text-gray-600 text-sm leading-relaxed">Aucune bio disponible </p>
                </div>

                <button id="btn-shortlist" class="w-full mt-7 rounded-xl bg-rose-400 px-4 py-3 font-semibold ">
                    + Ajouter à la shortlist
                </button>

                <p id="message-shortlist" class="mt-3 text-center text-sm"></p>
            </div>
        </aside>
            
            <main class="w-full min-w-0 flex-1 border border-rose-200 rounded-2xl p-3 m-2">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-2xl font-bold text-rose-800">dépôts</h2>
                    <span id="tot-depots" class="bg-rose-300">0 dépots</span>
                </div>
                <div id="depot-containir" class="grid grid-cols-1 md:grid-cols-2 gap-4 overflow-y-auto p-3  max-h-[600px] ">

                </div>
            </main>

        </div>

</body>
</html>
