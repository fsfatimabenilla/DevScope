
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/modeles/profile.js" type="module"></script>
</head>

<body class="min-h-screen bg-[#fff8fa] text-slate-700">
    <header class=" top-0 z-50 border-b border-rose-100 bg-white/90 ">
        <div class="mx-auto flex max-w-7xl items-center justify-between px-5 py-4">
            <h1 class="text-2xl font-extrabold  text-rose-800">
                Dev<span class="text-slate-700">Scope</span>
            </h1>
            <nav>
                <ul class="flex items-center gap-3 text-sm font-medium sm:gap-6">
                    <li><a href="index.html"class="rounded-lg bg-rose-100 text-rose-800 px-3 py-2">Recherche</a></li>
                    <li><a href="shortlist.html"class="rounded-lg px-4 py-2 text-slate-600 ">Shortlist</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">

        <div class="grid grid-cols-1 gap-6 lg:grid-cols-12">
            <aside class="lg:col-span-4">
                <div id="profile-card" class=" rounded-2xl border border-rose-100 bg-white shadow-sm">
                    <div class="h-24 bg-gradient-to-r from-rose-200 via-pink-100 to-rose-100"></div>

                    <div class="px-6 pb-6">
                        <div class="-mt-14 flex flex-col items-center text-center">

                            <img id="avatar" src="" alt="Photo du développeur" class="h-28 w-28 rounded-full border-4 border-white bg-rose-50 object-cover shadow-md">
                            <h2 id="nom" class="mt-4 text-2xl font-bold text-slate-800">
                                Username
                            </h2>
                            <p id="login" class="mt-1 text-sm font-medium text-rose-500">@login</p>
                            <a href="#" id="lien-github" class="mt-3 inline-flex items-center gap-2 rounded-full border border-rose-100 hover:bg-rose-50 px-4 py-2 text-sm font-semibold text-rose-700 ">Voir le profile originale</a>
                        </div>

                        <div class="mt-7 border-t border-slate-100 pt-5">
                            <h3 class="text-sm font-bold uppercase  text-rose-700">
                                À propos
                            </h3>

                            <p id="bio" class="mt-3 text-sm  text-slate-600">Aucune bio disponible</p>
                        </div>

                        <div class="mt-5 flex items-center gap-3 rounded-xl bg-rose-50 p-3">
                            <span class="text-xl">📍</span>
                            <div>
                                <p class="text-xs font-medium text-slate-500">Localisation</p>
                                <p id="ville" class="text-sm font-semibold text-slate-800">Non spécifiée</p>
                            </div>
                        </div>

                        <div class="mt-5 grid grid-cols-2 gap-3">

                            <div class="rounded-xl border border-rose-100 bg-white p-4 text-center">
                                <p id="followers" class="text-2xl font-bold text-rose-700">0</p>
                                <p class="mt-1 text-xs font-medium text-slate-500">
                                    Followers
                                </p>
                            </div>

                            <div class="rounded-xl border border-rose-100 bg-white p-4 text-center">
                                <p id="following" class="text-2xl font-bold text-rose-700">0</p>
                                <p class="mt-1 text-xs font-medium text-slate-500">
                                    Following
                                </p>
                            </div>

                        </div>
                        <button id="btn-shortlist"class="mt-6 w-full rounded-xl bg-rose-500 px-4 py-3 font-semibold text-white shadow-sm transition hover:bg-rose-600 hover:shadow-md active:scale-[0.98]">
                            + Ajouter à la shortlist
                        </button>
                        <p id="message-shortlist" class="mt-3 text-center text-sm font-medium"></p>
                    </div>
                </div>

            </aside>

            <section class="min-w-0 lg:col-span-8">

                <div class="rounded-2xl border border-rose-100 bg-white p-5 shadow-sm sm:p-6">
                    <div class="mb-6 flex flex-wrap items-center justify-between gap-3">
                        <div>
                            <p class="text-xs font-semibold uppercase text-rose-500">GitHub activity</p>
                            <h2 class="mt-1 text-2xl font-bold text-slate-800">
                                Mes dépôts
                            </h2>
                            <p class="mt-1 text-sm text-slate-500">
                                Découvrez les projets de ce développeur.
                            </p>
                        </div>
                        <span id="tot-depots"class="rounded-full bg-rose-50 px-4 py-2 text-sm font-semibold text-rose-700">0 dépôts</span>
                    </div>

                    <div id="depot-containir" class="grid max-h-[750px] grid-cols-1 gap-4 overflow-y-auto pr-2 md:grid-cols-2">

                    </div>

                </div>

            </section>

        </div>

    </main>

</body>
</html>
