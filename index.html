<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevScope</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-pink-100 text-gray-800">

    <header class="fixed top-0 left-0 z-50 w-full bg-rose-200">
        <div class="flex items-center justify-between px-6 py-4">
            <h1 class="text-2xl font-bold text-rose-800">DevScope </h1>
            <nav>
                <ul class="flex items-center gap-5">
                    <li><a href="index.html" class="rounded-lg bg-pink-100 px-4 py-2 text-rose-800"> Recherche</a></li>
                    <li><a href="shortlist.html"class="text-rose-800">Shortlist</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="flex min-h-screen items-center justify-center px-5 pt-20">

        <section class="w-full max-w-2xl text-center">
            <h2 class="text-3xl font-bold text-rose-900 sm:text-4xl">
                Trouver un développeur GitHub
            </h2>
            <p class="mt-5 text-gray-600">
                Découvrez les profils, les projets et les compétences des développeurs en quelques secondes.
             </p>

            <div class="mt-8 flex flex-col gap-3 sm:flex-row">
                <input type="search" id="Recherche" placeholder="Trouver un profil..." class="flex-1 rounded-lg border border-rose-200 bg-white px-4 py-3 outline-none focus:border-rose-400" >

                <button type="button"  class="rounded-lg bg-rose-200 px-6 py-3 font-semibold text-rose-900 hover:bg-rose-300">  Analyser
                </button>
            </div>

        </section>

    </main>
</body>
</html>
