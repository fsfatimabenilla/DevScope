<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shortlist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/modeles/shortliste.js" type="module"></script>
</head>
<body class="min-h-screen bg-[#fff8fa] text-slate-700">
    <header class=" top-0 z-50 border-b border-rose-100 bg-white/90 ">
        <div class="mx-auto flex max-w-7xl items-center justify-between px-5 py-4">
            <h1 class="text-2xl font-extrabold  text-rose-800">
                Dev<span class="text-slate-700">Scope</span>
            </h1>
            <nav>
                <ul class="flex items-center gap-3 text-sm font-medium sm:gap-6">
                    <li><a href="index.html"class="rounded-lg text-slate-600  px-3 py-2">Recherche</a></li>
                    <li><a href="shortlist.html"class="rounded-lg bg-rose-100 text-rose-800   px-4 py-2">Shortlist</a></li>
                </ul>
            </nav>
        </div>
    </header>

     <main class="mx-auto max-w-7xl px-5 pb-12 pt-10">
        <section class="flex justify-between items-center rounded-3xl border border-rose-100 bg-white p-8 shadow-sm ">
            <div>
                <h1 class="mt-3 text-3xl font-extrabold text-rose-900 sm:text-4xl">
                    Ma Shortlist
                </h1>
                <p class="mt-3 text-sm text-slate-500 sm:text-base">
                    les candidats dans votre shortlist .
                </p>
            </div>
            <div class="flex items-center justify-center border rounded-2xl bg-rose-200 p-3  ">
                <p id="tot-user" class="text-sm font-bold text-rose-800">0 Developers</p>
            </div>
        </section>
        <section class="mt-7 flex flex-col justify-between gap-3 rounded-2xl border border-rose-100 bg-white p-5 shadow-sm lg:flex-row  lg:items-center"">
                <nav>
                    <ul class="flex flex-wrap gap-2 text-sm font-medium">
                        <li><button type="button" class="bg-rose-300 rounded-lg p-4">Tous</button></li>
                        <li><button type="button" class="p-4 rounded-lg hover:bg-rose-200">A contacter</button></li>
                        <li><button type="button" class="p-4 rounded-lg hover:bg-rose-200">Entretien</button></li>
                        <li><button type="button" class="p-4 rounded-lg hover:bg-rose-200">Retenu</button></li>
                        <li><button type="button" class="p-4 rounded-lg hover:bg-rose-200">Refusé</button></li>
                    </ul>
                </nav>
                 <input type="search" id="Recherche" placeholder="Rechercher un candidat ..."  class="rounded-xl border border-rose-200 bg-white px-4 py-3 outline-none focus:border-rose-400 sm:w-27" >
        </section>
        <section id="profil-containir" class="flex max-h-[650px] flex-col gap-4 overflow-y-auto rounded-2xl p-1">

        </section>
     </main>
</body>
</html>
